name: CI

on:
  push:
    branches: ["*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.26.4"
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -v ./...
